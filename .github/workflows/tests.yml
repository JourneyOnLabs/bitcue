name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # Raspberry Pi OS Bookworm and Trixie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pillow (for the small-screen tests)
        run: python -m pip install pillow
      - name: All tests, against the pretend Z1
        run: PYTHON=python bash tests/run_all.sh
      - name: The demo page builds
        run: python tools/build_demo.py /tmp/demo.html
      - name: Shell scripts parse
        run: for f in install/*.sh install-to-pi.sh tools/*.sh; do bash -n "$f"; done
